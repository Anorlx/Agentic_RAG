      <text x="344" y="95" fill="#79a5cf" font-size="10">0.8s</text>
      <circle cx="25" cy="129" r="7" fill="#1d4e7a" stroke="#66b6f3" stroke-width="1.4"/>
      <path d="m22 129 2 2 4-5" fill="none" stroke="#dcf1ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
