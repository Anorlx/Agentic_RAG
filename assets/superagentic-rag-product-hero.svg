      <circle cx="19" cy="19" r="7" fill="#38bdf8"/>
      <circle cx="24" cy="24" r="7" fill="#1d4ed8" fill-opacity=".72"/>
      <text x="42" y="22" fill="#dbeafe" font-size="11.5" font-weight="600">水稻智能监测知识空间</text>
      <text x="42" y="39" fill="#7794b5" font-size="10.5">12 份资料 · 私有</text>
      <path d="m194 23 4 4 4-4" fill="none" stroke="#89a7c5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="105" y="470" fill="#5e7898" font-size="10.5" font-weight="700" letter-spacing="1.1">工作台</text>
    <g transform="translate(103 483)">
