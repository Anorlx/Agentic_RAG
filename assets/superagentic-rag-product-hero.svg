      <text x="44" y="145" fill="#7795b3" font-size="10.3">24 → 8 个片段</text>
      <text x="344" y="135" fill="#79a5cf" font-size="10">1.6s</text>
      <circle cx="25" cy="169" r="7" fill="#1d4e7a" stroke="#66b6f3" stroke-width="1.4"/>
      <path d="m22 169 2 2 4-5" fill="none" stroke="#dcf1ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
