<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SuperAgenticRAG 产品界面效果图</title>
  <desc id="desc">深色农业知识助手界面，展示水稻问答、实时证据脉络与可追溯引用。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0b1d35"/>
      <stop offset="1" stop-color="#071728"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14243b"/>
      <stop offset="1" stop-color="#0c192b"/>
    </linearGradient>
    <linearGradient id="assistant" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b67"/>
      <stop offset="1" stop-color="#123052"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020814" flood-opacity="0.58"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#7aa7dc" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- restrained technical background -->
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1320" cy="112" r="220" fill="#2563eb" fill-opacity="0.13" filter="url(#soft)"/>
  <circle cx="260" cy="900" r="220" fill="#0ea5e9" fill-opacity="0.08" filter="url(#soft)"/>
  <path d="M82 191H1518" stroke="#80a9d4" stroke-opacity="0.18"/>

  <!-- headline -->
  <g font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(86 74)">
      <rect width="34" height="34" rx="10" fill="#1d4ed8"/>
      <path d="M10 12.5 17 8l7 4.5v8L17 25l-7-4.5zM17 8v8.7m7-4.2-7 4.2-7-4.2" fill="none" stroke="#dbeafe" stroke-width="1.55" stroke-linejoin="round"/>
      <text x="47" y="14" fill="#dcecff" font-size="16" font-weight="700" letter-spacing="1.6">SUPERAGENTICRAG</text>
      <text x="47" y="31" fill="#7190b5" font-size="12" letter-spacing=".5">EVIDENCE-FIRST AGRICULTURAL COPILOT</text>
    </g>
    <text x="86" y="158" fill="#f4f8ff" font-size="42" font-weight="700" letter-spacing="-.8">让每一次农业决策，都有证据可循</text>
    <text x="89" y="190" fill="#9fb6d0" font-size="17">从问题理解到引用回溯，把复杂的田间知识转化为可信赖的行动建议。</text>
    <g transform="translate(1239 132)">
      <rect width="278" height="42" rx="21" fill="#102b4d" stroke="#2d5e9c" stroke-opacity=".8"/>
      <circle cx="22" cy="21" r="5" fill="#4ade80"/>
      <text x="38" y="26" fill="#b8d8ff" font-size="14" font-weight="600">知识库 · 网页证据 · 运行 Trace</text>
    </g>
  </g>

