    <rect x="82" y="236" width="1436" height="690" rx="24" fill="url(#window)" stroke="#3a587a" stroke-opacity=".72"/>
    <rect x="83" y="237" width="1434" height="52" rx="23" fill="#162941"/>
    <path d="M83 269h1434v20H83z" fill="#162941"/>
    <circle cx="116" cy="262" r="5" fill="#f87171"/>
    <circle cx="136" cy="262" r="5" fill="#fbbf24"/>
    <circle cx="156" cy="262" r="5" fill="#4ade80"/>
    <text x="800" y="268" text-anchor="middle" fill="#8ba4c2" font-size="13" font-weight="600">SuperAgenticRAG · 农业知识空间</text>

